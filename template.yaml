AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  OpenCV Label Guard - same definition as the deployed function (values checked against a read-only
  snapshot in tests/fixtures/deployed-config.json by tests/test_sam_template.py). Alarms are defined
  only; they are created when this template is deployed. Not deployed from this repo.

Resources:
  LayerCv2:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: label-guard-cv2
      ContentUri: dist/layer-cv2.zip
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]

  LayerLibs:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: label-guard-libs-numpy
      ContentUri: dist/layer-libs-numpy.zip
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]

  LabelGuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: label-guard
      Description: OpenCV label guard
      CodeUri: dist/function.zip
      Handler: label_guard.infrastructure.lambda_handler.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 60
      EphemeralStorage:
        Size: 512
      ReservedConcurrentExecutions: 5   # abuse cap: extra requests get 429
      Layers:
        - !Ref LayerCv2
        - !Ref LayerLibs
      Environment:
        Variables:
          PYTHONPATH: /var/task:/opt/python
      Policies:
        - AWSLambdaBasicExecutionRole   # logs only; no S3, DB or network permissions
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  LabelGuardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/label-guard
      RetentionInDays: 7

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: label-guard returned errors (defined only; no notification target)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LabelGuardFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: label-guard hit the reserved concurrency cap of 5 (429s)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LabelGuardFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionUrl:
    Value: !GetAtt LabelGuardFunctionUrl.FunctionUrl
